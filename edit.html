<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v4 Metadata | AniClips</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script>
        tailwind.config = {
            theme: { extend: { colors: { gray: { 900: '#0f172a', 950: '#020617' } } } }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; }
        .drawer { position: fixed; right: 0; top: 0; width: 450px; height: 100vh; background: #0f172a; border-left: 1px solid rgba(255,255,255,0.05); transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 100; display: flex; flex-direction: column; }
        .drawer.open { transform: translateX(0); box-shadow: -20px 0 50px rgba(0,0,0,0.5); }
        .input-dark { background: #020617; border: 1px solid #1e293b; color: white; border-radius: 6px; padding: 10px; font-size: 13px; width: 100%; outline: none; transition: border-color 0.2s; }
        .input-dark:focus { border-color: #3b82f6; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen bg-slate-950 flex flex-col">

    <!-- HEADER -->
    <nav class="sticky top-0 h-14 border-b border-white/5 flex items-center px-6 bg-slate-950/80 backdrop-blur z-40">
        <div class="flex items-center gap-4">
            <a href="admin.html" class="w-8 h-8 rounded-full hover:bg-white/5 flex items-center justify-center text-slate-500 hover:text-white transition-all">
                <span class="material-symbols-rounded">arrow_back</span>
            </a>
            <h1 class="text-xs font-black uppercase tracking-widest text-white" id="page-title">Edit Series</h1>
        </div>
        <div class="ml-auto flex items-center gap-3">
            <span id="save-status" class="text-[10px] font-bold text-slate-500 uppercase tracking-widest opacity-0 transition-opacity">Saving...</span>
            <button onclick="saveSeries()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-md font-bold text-[10px] uppercase tracking-widest shadow-lg shadow-blue-900/20 transition-all">
                Save Metadata
            </button>
        </div>
    </nav>

    <main class="container mx-auto px-6 py-8 flex flex-col gap-8">
        
        <!-- METADATA FORM -->
        <section class="grid grid-cols-12 gap-8 bg-slate-900/50 p-8 rounded-2xl border border-white/5">
            <div class="col-span-12 md:col-span-3">
                <div class="relative group aspect-[3/4] rounded-xl overflow-hidden bg-black border border-white/5 shadow-2xl">
                    <img id="poster-preview" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity" src="https://placehold.co/300x400?text=Poster">
                    <div class="absolute inset-x-0 bottom-0 p-4 bg-gradient-to-t from-black to-transparent opacity-0 group-hover:opacity-100 transition-opacity">
                        <input type="text" id="anime-poster" onchange="updatePreview()" placeholder="Poster URL" class="w-full bg-black/50 backdrop-blur-md border border-white/10 text-[10px] p-2 rounded text-white outline-none">
                    </div>
                </div>
            </div>
            
            <div class="col-span-12 md:col-span-9 flex flex-col gap-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5 block ml-1">Internal Name (Slug)</label>
                        <input type="text" id="anime-slug" class="input-dark font-mono" placeholder="e.g. frieren">
                    </div>
                    <div>
                        <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5 block ml-1">Display Title</label>
                        <input type="text" id="anime-title" class="input-dark" placeholder="e.g. Frieren: Beyond Journey's End">
                    </div>
                </div>
                
                <div class="flex-grow">
                    <label class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1.5 block ml-1">Series Description</label>
                    <textarea id="anime-desc" class="input-dark h-32 resize-none" placeholder="Enter series synopsis..."></textarea>
                </div>

                <div class="flex items-center gap-6 mt-2">
                    <label class="flex items-center gap-3 cursor-pointer group">
                        <input type="checkbox" id="anime-featured" class="w-4 h-4 rounded border-slate-700 bg-slate-900 text-blue-600 focus:ring-0">
                        <span class="text-[11px] font-bold text-slate-400 group-hover:text-white uppercase tracking-widest">Feature on Home</span>
                    </label>
                </div>
            </div>
        </section>

        <!-- CONTENT INVENTORY -->
        <section>
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xs font-black text-white uppercase tracking-widest flex items-center gap-2">
                    <span class="material-symbols-rounded text-blue-500">inventory_2</span> Content Inventory & Redundancy
                </h2>
                <div class="flex items-center gap-2 text-[10px] font-bold text-slate-500 uppercase">
                    <div class="w-2 h-2 rounded-full bg-emerald-500"></div> All Sync'd
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="content-list">
                <!-- Episode cards load here -->
            </div>
        </section>
        
        <!-- DANGER ZONE -->
        <section class="mt-4 pt-8 border-t border-red-500/20">
            <div class="bg-red-500/10 border border-red-500/20 rounded-2xl p-6 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                <div>
                    <h2 class="text-xs font-black text-red-500 uppercase tracking-widest flex items-center gap-2"><span class="material-symbols-rounded text-sm">warning</span> Danger Zone</h2>
                    <p class="text-[10px] text-slate-400 mt-1">Permanently delete this series and all associated metadata, episodes, and clips. This action cannot be undone.</p>
                </div>
                <button onclick="deleteSeries()" class="bg-red-600 hover:bg-red-500 text-white px-6 py-2.5 rounded-lg font-black text-[10px] uppercase tracking-widest shadow-lg shadow-red-900/20 transition-all flex items-center gap-2 shrink-0">
                    <span class="material-symbols-rounded text-sm">delete_forever</span> Delete Series
                </button>
            </div>
        </section>
    </main>

    <!-- CLIP EDITOR DRAWER -->
    <aside id="clip-drawer" class="drawer">
        <div class="p-6 border-b border-white/5 bg-slate-950/20 flex justify-between items-center">
            <div>
                <h2 class="text-sm font-black uppercase tracking-widest text-white">Clip Inspector</h2>
                <div id="drawer-subtitle" class="text-[9px] font-mono text-slate-500 uppercase mt-0.5">EPISODE --</div>
            </div>
            <button onclick="closeDrawer()" class="text-slate-500 hover:text-white transition-colors"><span class="material-symbols-rounded">close</span></button>
        </div>

        <!-- SEARCH / FILTER INSIDE DRAWER -->
        <div class="p-4 border-b border-white/5">
            <input type="text" id="clip-search" onkeyup="filterClips()" placeholder="Filter clips in this episode..." class="input-dark py-1.5 text-xs">
        </div>

        <div id="drawer-loading" class="flex-grow flex items-center justify-center flex-col gap-3 text-slate-600 hidden">
            <span class="material-symbols-rounded animate-spin text-3xl">sync</span>
            <span class="text-[10px] font-black uppercase tracking-widest">Fetching Clip List...</span>
        </div>

        <div id="clip-list" class="flex-grow overflow-y-auto divide-y divide-white/5">
            <!-- Individual clip items -->
        </div>

        <!-- FOOTER OVERLAY FOR EDITING (HIDDEN BY DEFAULT) -->
        <div id="clip-form" class="hidden p-6 bg-slate-950 border-t border-white/10 space-y-4">
            <div class="flex justify-between items-center">
                <span class="text-[10px] font-black text-blue-400 uppercase">Editing Clip</span>
                <button onclick="hideClipForm()" class="text-[10px] font-bold text-slate-500 uppercase">Cancel</button>
            </div>
            <input type="hidden" id="edit-clip-id">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[9px] text-slate-500 uppercase font-black mb-1 block">Start MS</label>
                    <input type="number" id="edit-start" class="input-dark">
                </div>
                <div>
                    <label class="text-[9px] text-slate-500 uppercase font-black mb-1 block">End MS</label>
                    <input type="number" id="edit-end" class="input-dark">
                </div>
            </div>
            <button onclick="commitClipUpdate()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-black text-xs uppercase tracking-widest transition-all">Update Clip Bounds</button>
        </div>
    </aside>

    <script>
        const API_URL = 'https://aniclip-backend.onrender.com/api';
        const ADMIN_KEY = localStorage.getItem('aniclip_admin_key');
        const slug = new URLSearchParams(window.location.search).get('name');
        
        let currentAnimeId = null;
        let currentMalId = null;
        let currentEpisodeClips = [];
        
        // --- DECRYPTION ENGINE ---
        const cryptoCache = {};
        const blobCache = {};

        async function getEpisodeCrypto(malId, epNum) {
            const token = `${malId}-${epNum}`;
            if (cryptoCache[token]) return cryptoCache[token];
            
            const res = await fetch(`${API_URL}/episodes/${malId}/${epNum}/key`);
            const data = await res.json();
            const keyBytes = new Uint8Array(data.key.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
            const ivSeedBytes = new Uint8Array(data.iv_seed.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
            
            const cryptoKey = await crypto.subtle.importKey("raw", keyBytes, { name: "AES-CTR" }, false, ["decrypt"]);
            cryptoCache[token] = { key: cryptoKey, ivSeed: ivSeedBytes };
            return cryptoCache[token];
        }

        async function deriveClipIV(ivSeed, clipId) {
            const key = await crypto.subtle.importKey("raw", ivSeed, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
            const idBytes = new TextEncoder().encode(clipId);
            const signature = await crypto.subtle.sign("HMAC", key, idBytes);
            return new Uint8Array(signature).slice(0, 16);
        }

        async function secureObjectUrl(url, clipId, type = 'video') {
            if (!url) return "";
            if (!url.endsWith('.bin') && !url.endsWith('.ebp')) return url;
            if (blobCache[url]) return blobCache[url];
            
            try {
                const parts = clipId.split('-');
                const malId = parts[0];
                const epNum = parts[1];
                
                const epCrypto = await getEpisodeCrypto(malId, epNum);
                const clipIv = await deriveClipIV(epCrypto.ivSeed, clipId);
                
                const res = await fetch(url);
                const ciphertext = await res.arrayBuffer();
                const decryptedBuffer = await crypto.subtle.decrypt({ name: "AES-CTR", counter: clipIv, length: 128 }, epCrypto.key, ciphertext);
                
                const mimeType = url.endsWith('.ebp') ? 'image/webp' : 'video/mp4';
                const blob = new Blob([decryptedBuffer], { type: mimeType });
                blobCache[url] = URL.createObjectURL(blob);
                return blobCache[url];
            } catch (e) { console.error("Decryption failed:", url, e); return ""; }
        }

        async function playPreview(el, hoverUrl, clipId) { 
            let v = el.querySelector('video');
            if (!v) {
                el.innerHTML += `<div class="absolute inset-0 flex items-center justify-center bg-black/80 z-10"><span class="material-symbols-rounded animate-spin text-white">progress_activity</span></div>`;
                const decryptedUrl = await secureObjectUrl(hoverUrl, clipId, 'video');
                el.querySelector('.absolute.inset-0.bg-black\\/80')?.remove();
                if(decryptedUrl) {
                    el.insertAdjacentHTML('beforeend', `<video src="${decryptedUrl}" loop muted playsinline class="absolute inset-0 w-full h-full object-cover z-0"></video>`);
                    v = el.querySelector('video');
                }
            }
            if(v) { v.currentTime = 0; v.play().catch(()=>{}); } 
        }
        
        function stopPreview(el) { const v=el.querySelector('video'); if(v) v.pause(); }

        async function init() {
            if (!ADMIN_KEY) window.location.href = 'auth.html';
            if (slug) {
                await loadSeriesMetadata();
                await loadRedundancyReport();
            }
        }

        async function loadSeriesMetadata() {
            try {
                const res = await fetch(`${API_URL}/admin/animes/${slug}`, { 
                    headers: { 'Authorization': `Bearer ${ADMIN_KEY}` } 
                });
                const anime = await res.json();
                
                currentAnimeId = anime.id;
                currentMalId = anime.mal_id;
                
                document.getElementById('anime-title').value = anime.title || '';
                document.getElementById('anime-slug').value = anime.name || '';
                document.getElementById('anime-desc').value = anime.description || '';
                document.getElementById('anime-poster').value = anime.poster_url || '';
                document.getElementById('anime-featured').checked = anime.is_featured || false;
                document.getElementById('poster-preview').src = anime.poster_url || 'https://placehold.co/300x400?text=No+Poster';
                document.getElementById('page-title').innerText = `Editing: ${anime.title || anime.name}`;
            } catch (e) { console.error("Metadata Load Failed", e); }
        }

        async function loadRedundancyReport() {
            try {
                const res = await fetch(`${API_URL}/admin/redundancy/anime/${slug}`, { 
                    headers: { 'Authorization': `Bearer ${ADMIN_KEY}` } 
                });
                const report = await res.json();
                
                const list = document.getElementById('content-list');
                list.innerHTML = report.map(ep => `
                    <div class="bg-slate-900 border border-white/5 rounded-xl p-5 flex justify-between items-center group hover:border-blue-500/30 transition-all">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-lg bg-slate-950 flex flex-col items-center justify-center border border-white/5">
                                <span class="text-[9px] font-black text-slate-500 uppercase leading-none mb-0.5">EP</span>
                                <span class="text-sm font-black text-white leading-none">${ep.number}</span>
                            </div>
                            <div>
                                <div class="text-[10px] font-bold text-white uppercase tracking-wider">${ep.clips} Total Clips</div>
                                <div class="text-[9px] text-slate-500 mt-1 uppercase font-black flex items-center gap-1">
                                    <span class="w-1.5 h-1.5 rounded-full ${ep.factor >= 1 ? 'bg-emerald-500' : 'bg-yellow-500'}"></span>
                                    Factor: ${ep.factor}
                                </div>
                            </div>
                        </div>
                        <button onclick="inspectEpisode(${ep.number})" class="w-9 h-9 rounded-full bg-slate-950 border border-white/10 flex items-center justify-center text-slate-500 hover:text-blue-400 hover:border-blue-500/50 transition-all">
                            <span class="material-symbols-rounded">settings_ethernet</span>
                        </button>
                    </div>
                `).join('');
            } catch (e) { console.error("Report Load Failed", e); }
        }

        async function inspectEpisode(num) {
            const drawer = document.getElementById('clip-drawer');
            const list = document.getElementById('clip-list');
            const loading = document.getElementById('drawer-loading');
            
            document.getElementById('drawer-subtitle').innerText = `EPISODE ${num} • CONTENT INSPECTION`;
            drawer.classList.add('open');
            list.innerHTML = '';
            loading.classList.remove('hidden');

            try {
                const res = await fetch(`${API_URL}/admin/animes/${slug}/episodes/${num}/clips`, { 
                    headers: { 'Authorization': `Bearer ${ADMIN_KEY}` } 
                });
                currentEpisodeClips = await res.json();
                renderClipList(currentEpisodeClips);
            } catch (e) {
                list.innerHTML = `<div class="p-10 text-center text-red-500 text-xs">Error loading clips.</div>`;
            } finally {
                loading.classList.add('hidden');
            }
        }

        function renderClipList(clips) {
            const list = document.getElementById('clip-list');
            if (clips.length === 0) {
                list.innerHTML = `<div class="p-10 text-center text-slate-600 text-xs italic uppercase tracking-widest">No clips found in this episode.</div>`;
                return;
            }

            list.innerHTML = clips.map(c => `
                <div class="px-6 py-4 flex justify-between items-center hover:bg-white/[0.02] group">
                    <div class="flex items-center gap-4">
                        <div class="relative w-24 h-14 bg-slate-950 rounded border border-white/10 overflow-hidden flex-shrink-0 cursor-pointer clip-card group/vid z-10" data-thumb="${c.full_thumb_url || ''}" data-clip-id="${c.id}" onmouseenter="playPreview(this, '${c.full_video_url || ''}', '${c.id}')" onmouseleave="stopPreview(this)">
                            <div class="absolute inset-0 flex items-center justify-center animate-pulse bg-slate-900"><span class="material-symbols-rounded text-slate-700 text-sm">image</span></div>
                            <img src="" class="clip-thumb absolute inset-0 w-full h-full object-cover opacity-80 group-hover/vid:opacity-0 transition-opacity z-10 hidden">
                        </div>
                        <div>
                            <div class="text-[10px] font-mono text-blue-400 mb-0.5">#${c.id.split('-').pop()}</div>
                            <div class="text-[11px] font-bold text-white uppercase tracking-wide">${(c.start_ms/1000).toFixed(2)}s — ${(c.end_ms/1000).toFixed(2)}s</div>
                            <div class="text-[9px] text-slate-500 mt-0.5 font-black uppercase tracking-tighter">${c.duration_ms}ms Duration</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick='editClip(${JSON.stringify(c)})' class="w-8 h-8 rounded hover:bg-blue-600 flex items-center justify-center text-slate-400 hover:text-white transition-all"><span class="material-symbols-rounded text-sm">edit</span></button>
                        <button onclick="deleteClip('${c.id}')" class="w-8 h-8 rounded hover:bg-red-600 flex items-center justify-center text-slate-400 hover:text-white transition-all"><span class="material-symbols-rounded text-sm">delete</span></button>
                    </div>
                </div>
            `).join('');

            // Async decryption hook for thumbnails
            setTimeout(() => {
                list.querySelectorAll('.clip-card').forEach(async (card) => {
                    const img = card.querySelector('.clip-thumb');
                    const rawUrl = card.getAttribute('data-thumb');
                    const cId = card.getAttribute('data-clip-id');
                    if (rawUrl) {
                        const decrypted = await secureObjectUrl(rawUrl, cId, 'image');
                        if(decrypted) {
                            img.src = decrypted;
                            img.classList.remove('hidden');
                            card.querySelector('.animate-pulse')?.remove();
                        }
                    }
                });
            }, 50);
        }

        function editClip(clip) {
            document.getElementById('edit-clip-id').value = clip.id;
            document.getElementById('edit-start').value = clip.start_ms;
            document.getElementById('edit-end').value = clip.end_ms;
            document.getElementById('clip-form').classList.remove('hidden');
            document.getElementById('clip-list').classList.add('opacity-30');
        }

        function hideClipForm() {
            document.getElementById('clip-form').classList.add('hidden');
            document.getElementById('clip-list').classList.remove('opacity-30');
        }

        async function commitClipUpdate() {
            const id = document.getElementById('edit-clip-id').value;
            const start = parseInt(document.getElementById('edit-start').value);
            const end = parseInt(document.getElementById('edit-end').value);
            
            try {
                const res = await fetch(`${API_URL}/admin/clips/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ADMIN_KEY}` },
                    body: JSON.stringify({ start_ms: start, end_ms: end, duration_ms: (end - start) })
                });
                if (res.ok) {
                    hideClipForm();
                    // Live update local data
                    const clip = currentEpisodeClips.find(c => c.id === id);
                    if (clip) { clip.start_ms = start; clip.end_ms = end; clip.duration_ms = (end - start); }
                    renderClipList(currentEpisodeClips);
                }
            } catch (e) { alert("Update failed"); }
        }

        async function deleteClip(id) {
            if(!confirm("DANGER: Delete this clip? This cannot be undone.")) return;
            try {
                const res = await fetch(`${API_URL}/admin/clips/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${ADMIN_KEY}` }
                });
                if (res.ok) {
                    currentEpisodeClips = currentEpisodeClips.filter(c => c.id !== id);
                    renderClipList(currentEpisodeClips);
                    loadRedundancyReport(); // Refresh counts
                }
            } catch (e) { console.error(e); }
        }

        async function deleteSeries() {
            if (!currentAnimeId) return;
            const confirm1 = confirm("DANGER: Are you sure you want to completely delete this series?");
            if (!confirm1) return;
            const confirm2 = confirm("FINAL WARNING: All episodes and clips belonging to this series will be permanently wiped from the library. Click OK to proceed.");
            if (!confirm2) return;
            
            try {
                const res = await fetch(`${API_URL}/admin/animes/${currentAnimeId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${ADMIN_KEY}` }
                });
                if (res.ok) {
                    window.location.href = 'admin.html';
                } else {
                    alert("Failed to delete series.");
                }
            } catch (e) {
                console.error(e);
                alert("Error deleting series.");
            }
        }

        async function saveSeries() {
            const status = document.getElementById('save-status');
            status.innerText = "Saving...";
            status.style.opacity = "1";

            const payload = {
                name: document.getElementById('anime-slug').value,
                title: document.getElementById('anime-title').value,
                description: document.getElementById('anime-desc').value,
                poster_url: document.getElementById('anime-poster').value,
                is_featured: document.getElementById('anime-featured').checked
            };

            try {
                const res = await fetch(`${API_URL}/admin/animes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ADMIN_KEY}` },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    status.innerText = "All Changes Saved";
                    setTimeout(() => status.style.opacity = "0", 3000);
                }
            } catch (e) { status.innerText = "Save Failed"; }
        }

        function filterClips() {
            const q = document.getElementById('clip-search').value.toLowerCase();
            const filtered = currentEpisodeClips.filter(c => c.id.toLowerCase().includes(q) || c.start_ms.toString().includes(q));
            renderClipList(filtered);
        }

        function updatePreview() {
            document.getElementById('poster-preview').src = document.getElementById('anime-poster').value;
        }

        function closeDrawer() { 
            document.getElementById('clip-drawer').classList.remove('open'); 
            hideClipForm();
        }

        init();
    </script>
</body>
</html>
