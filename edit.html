<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Anime | Admin Panel</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { gray: { 900: '#0f172a', 950: '#020617' } },
                    animation: { 'slide-in': 'slideIn 0.3s ease-out forwards', 'slide-out': 'slideOut 0.3s ease-in forwards' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; overflow-x: hidden; }
        .material-symbols-rounded { font-size: 20px; vertical-align: middle; }
        .input-dark, select.input-dark, textarea.input-dark { background-color: #1e293b !important; border-color: #334155 !important; color: #f8fafc !important; width: 100%; border-radius: 0.5rem; padding: 0.6rem 1rem; font-size: 0.875rem; outline: none; transition: all 0.2s; }
        .input-dark:focus { border-color: #3b82f6 !important; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        .label-dark { display: block; font-size: 0.7rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
        .upload-zone { background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='8' ry='8' stroke='%23334155FF' stroke-width='2' stroke-dasharray='8%2c8' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e"); }
        .upload-zone:hover { background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='8' ry='8' stroke='%233B82F6FF' stroke-width='2' stroke-dasharray='8%2c8' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e"); background-color: rgba(59, 130, 246, 0.05); }
        #drawer-overlay, #modal-overlay { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); }
    </style>
</head>

<body class="min-h-screen flex flex-col bg-slate-950 relative">

    <nav class="sticky top-0 z-40 border-b border-white/5 bg-slate-950/90 backdrop-blur-md">
        <div class="container mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="admin.html" class="text-slate-400 hover:text-white flex items-center gap-1 text-sm font-bold transition-colors">
                    <span class="material-symbols-rounded">arrow_back</span> <span class="hidden sm:inline">Back</span>
                </a>
                <div class="h-4 w-[1px] bg-slate-700"></div>
                <span class="text-white font-bold text-lg flex items-center gap-2">
                    <span class="material-symbols-rounded text-slate-500">edit_square</span> <span id="page-header-title">Edit Series</span>
                </span>
                <a id="btn-view-gist" target="_blank" href="#" class="hidden ml-4 text-[10px] font-mono text-emerald-400 border border-emerald-500/30 bg-emerald-900/10 px-2 py-1 rounded hover:bg-emerald-500/20 transition-colors"><span class="flex items-center gap-1"><span class="material-symbols-rounded text-sm">code</span> JSON</span></a>
            </div>
            <button onclick="saveAllChanges()" id="main-save-btn" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-lg font-semibold text-sm transition-all shadow-lg flex items-center gap-2 group">
                <span class="material-symbols-rounded group-hover:scale-110 transition-transform">save</span> <span>Save Changes</span>
            </button>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 max-w-5xl">
        <div class="bg-slate-900 border border-white/5 rounded-xl p-6 mb-8 shadow-xl">
            <h2 class="text-base font-bold text-white mb-6 border-b border-white/5 pb-4 flex items-center gap-2"><span class="material-symbols-rounded text-blue-500 bg-blue-500/10 p-1 rounded">settings</span> Series Metadata</h2>
            <div class="flex flex-col sm:flex-row gap-6">
                <div class="shrink-0 w-48">
                    <label class="label-dark mb-2">Thumbnail (4:3)</label>
                    <input type="file" id="poster-upload" accept="image/*" class="hidden" onchange="handlePosterUpload(event)">
                    <div class="relative group w-full aspect-[4/3] rounded-lg overflow-hidden cursor-pointer transition-all border border-slate-700 hover:border-blue-500" onclick="document.getElementById('poster-upload').click()">
                        <div class="upload-zone absolute inset-0 bg-slate-950 transition-all flex flex-col items-center justify-center text-slate-500 group-hover:text-blue-400" id="poster-zone"><span class="material-symbols-rounded text-3xl mb-1">add_photo_alternate</span> <span class="text-[10px] font-bold uppercase">Upload</span></div>
                        <img id="poster-preview" src="" class="relative w-full h-full object-cover hidden z-10">
                    </div>
                    <div class="mt-2"><input type="text" id="poster-url-input" class="input-dark text-xs font-mono text-slate-400" placeholder="Paste URL..." oninput="updatePosterPreview(this.value)"></div>
                </div>
                <div class="flex-grow grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-4 content-start">
                    <input type="hidden" id="anime-id">
                    <div class="col-span-1 sm:col-span-2 flex gap-4 items-end">
                        <div class="flex-grow"><label class="label-dark">Title</label><input type="text" id="anime-title" class="input-dark"></div>
                        <div class="pb-2"><label class="flex items-center gap-2 cursor-pointer group"><input type="checkbox" id="anime-featured" class="w-4 h-4 rounded bg-slate-700"><span class="text-xs font-bold text-slate-400 group-hover:text-white uppercase">Featured</span></label></div>
                    </div>
                    <div class="col-span-1 sm:col-span-2"><label class="label-dark">Description</label><textarea id="anime-desc" class="input-dark h-20"></textarea></div>
                    <div class="col-span-1 sm:col-span-2">
                        <label class="label-dark">Tags</label>
                        <div class="relative"><input type="text" placeholder="Add tag & press Enter" class="input-dark pl-9" id="tags-input" onkeydown="handleTagInput(event)"><span class="material-symbols-rounded absolute left-2.5 top-2 text-slate-500 text-sm">label</span></div>
                        <div id="tags-preview" class="flex gap-2 mt-3 flex-wrap min-h-[1.5rem]"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-end mb-4" id="content-manager-header">
            <div><h3 class="text-lg font-bold text-white flex items-center gap-2"><span class="material-symbols-rounded text-emerald-400">movie_filter</span> Content Manager</h3><p class="text-xs text-slate-500 mt-1">Manage episodes.</p></div>
            <div class="flex gap-3">
                <button onclick="openImportModal()" class="bg-slate-800 text-slate-300 border border-slate-700 hover:border-white/20 hover:text-white px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-colors"><span class="material-symbols-rounded text-lg">data_object</span> Import JSON</button>
                <button onclick="addEpisode()" class="bg-blue-600/10 text-blue-400 border border-blue-600/20 hover:bg-blue-600/20 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition-colors"><span class="material-symbols-rounded text-lg">playlist_add</span> Add Episode</button>
            </div>
        </div>

        <div id="episodes-container" class="space-y-6 pb-20"></div>
        <div class="text-center text-slate-500 py-10 italic" id="empty-msg">Loading...</div>
    </main>

    <!-- IMPORT MODAL -->
    <div id="import-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div id="modal-overlay" class="absolute inset-0" onclick="closeImportModal()"></div>
        <div class="bg-slate-900 border border-slate-700 rounded-xl w-full max-w-2xl p-6 relative z-10 shadow-2xl">
            <h2 class="text-xl font-bold text-white mb-4 flex items-center gap-2"><span class="material-symbols-rounded text-blue-500">data_object</span> Import Data</h2>
            <div class="flex flex-col gap-4">
                <div class="border-2 border-dashed border-slate-700 rounded-lg p-6 text-center cursor-pointer hover:border-blue-500" onclick="document.getElementById('json-file-input').click()">
                    <span class="material-symbols-rounded text-4xl text-slate-600">upload_file</span><p class="text-slate-400 text-sm mt-2">Upload .json file</p>
                    <input type="file" id="json-file-input" accept=".json" class="hidden" onchange="handleFileSelect(event)">
                </div>
                <textarea id="json-paste-area" class="input-dark h-32 font-mono text-xs" placeholder="Or paste JSON text here..."></textarea>
            </div>
            <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-white/5">
                <button onclick="closeImportModal()" class="px-4 py-2 text-slate-400 hover:text-white text-sm font-bold">Cancel</button>
                <button onclick="processImport()" id="btn-process-import" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-lg font-bold text-sm">Import</button>
            </div>
        </div>
    </div>

    <!-- DRAWER -->
    <div id="drawer-overlay" class="fixed inset-0 z-40 hidden transition-opacity opacity-0" onclick="closeEditor()"></div>
    <aside id="clip-editor-drawer" class="fixed top-0 right-0 w-[400px] max-w-[90%] h-full bg-slate-950 border-l border-white/5 shadow-2xl z-50 translate-x-full transition-transform duration-300 ease-out flex flex-col">
        <div class="h-16 px-6 border-b border-white/5 flex justify-between items-center bg-slate-900/50">
            <h2 class="text-white font-bold flex items-center gap-2"><span class="material-symbols-rounded text-blue-500">tune</span> Clip Details</h2>
            <button onclick="closeEditor()" class="text-slate-500 hover:text-white transition-colors"><span class="material-symbols-rounded text-2xl">close</span></button>
        </div>
        <div class="flex-grow overflow-y-auto p-6 space-y-6">
            <input type="hidden" id="edit-clip-id">
            
            <div>
                <label class="label-dark mb-2">Thumbnail</label>
                <div class="relative group w-full aspect-16-9 bg-black rounded-lg overflow-hidden border border-slate-800 cursor-pointer" onclick="document.getElementById('edit-thumb-upload').click()">
                    <img id="edit-preview-img" src="" class="w-full h-full object-cover opacity-70">
                    <div class="absolute inset-0 flex flex-col items-center justify-center text-white/50 group-hover:bg-black/50 group-hover:text-white transition-all"><span class="material-symbols-rounded text-3xl">image_update</span></div>
                </div>
                <input type="file" id="edit-thumb-upload" class="hidden" accept="image/*" onchange="previewImage(event, 'edit-preview-img')">
                <input type="text" id="edit-thumb-url" class="input-dark mt-2 text-xs font-mono" placeholder="Thumbnail URL">
            </div>

            <div class="space-y-4">
                <div><label class="label-dark">Name</label><input type="text" id="edit-filename" class="input-dark font-mono"></div>
                
                <!-- NEW: HQ & Fast Fields -->
                <div>
                    <label class="label-dark flex justify-between">Fast URL <span class="text-slate-500 text-[10px]">720p</span></label>
                    <input type="text" id="edit-url" class="input-dark font-mono text-xs text-blue-400">
                </div>
                <div>
                    <label class="label-dark flex justify-between">HQ URL <span class="text-slate-500 text-[10px]">1080p</span></label>
                    <input type="text" id="edit-hq-url" class="input-dark font-mono text-xs text-indigo-400">
                </div>

                <div><label class="label-dark">Duration (s)</label><input type="text" id="edit-duration" class="input-dark font-mono"></div>
            </div>
        </div>
        <div class="p-4 border-t border-white/5 bg-slate-900/50 flex gap-3 items-center">
            <button onclick="deleteCurrentClip()" class="p-2 bg-red-500/10 text-red-500 hover:bg-red-600 rounded-lg"><span class="material-symbols-rounded text-lg">delete</span></button>
            <button onclick="saveClipEditor()" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold text-sm w-full">Save</button>
        </div>
    </aside>

    <!-- SCRIPT -->
    <script>
        const API_URL = 'https://aniclip-backend.onrender.com/api';
        const ADMIN_KEY = localStorage.getItem('aniclip_admin_key');
        if (!ADMIN_KEY) window.location.href = 'auth.html';

        const urlParams = new URLSearchParams(window.location.search);
        const ANIME_NAME_SLUG = urlParams.get('name');
        
        let currentEditingEpNum = null;
        let activeTags = [];
        let currentEditingRow = null;
        let importedJsonData = null;

        window.onload = async () => {
            if (ANIME_NAME_SLUG) {
                document.getElementById('page-header-title').innerText = `Edit: ${ANIME_NAME_SLUG}`;
                await loadData(ANIME_NAME_SLUG);
            } else {
                document.getElementById('page-header-title').innerText = "Create New Series";
                document.getElementById('empty-msg').innerText = "Save Metadata first.";
            }
        };

        async function loadData(slug) {
            try {
                const res = await fetch(`${API_URL}/animes/${slug}`);
                if (!res.ok) throw new Error("Fetch failed");
                const anime = await res.json();
                
                document.getElementById('anime-id').value = anime.id;
                document.getElementById('anime-title').value = anime.title || anime.name;
                document.getElementById('anime-desc').value = anime.description || '';
                if(anime.poster_url) updatePosterPreview(anime.poster_url);
                
                activeTags = anime.genres || [];
                renderTags();

                const epRes = await fetch(`${API_URL}/animes/${slug}/episodes`);
                const episodes = await epRes.json();
                document.getElementById('episodes-container').innerHTML = '';

                if(episodes.length > 0) {
                    document.getElementById('empty-msg').style.display='none';
                    const fullEps = await Promise.all(episodes.map(async ep => {
                        ep.clips = await (await fetch(`${API_URL}/animes/${slug}/episodes/${ep.number}/clips`)).json();
                        return ep;
                    }));
                    fullEps.sort((a,b)=>a.number-b.number).forEach(renderEpisode);
                } else document.getElementById('empty-msg').innerText="No content.";
            } catch (e) { console.error(e); }
        }

        function renderEpisode(ep) {
            const html = `
            <div class="bg-slate-900 border border-white/5 rounded-xl overflow-hidden shadow-sm" id="ep-${ep.id}">
                <div class="bg-slate-950/50 px-5 py-3 border-b border-white/5 flex items-center gap-4 cursor-pointer" onclick="toggleAccordion('${ep.id}')">
                    <span class="bg-slate-800 text-slate-400 text-[10px] font-bold px-2 py-1 rounded">EP ${ep.number}</span>
                    <input type="text" value="${ep.title||'Episode '+ep.number}" class="bg-transparent border-none text-white font-medium w-full text-sm" onclick="event.stopPropagation()">
                    <span class="material-symbols-rounded text-slate-500 ml-auto transition-transform" id="chevron-${ep.id}">expand_more</span>
                </div>
                <div class="p-5 hidden" id="content-${ep.id}">
                    <div class="border border-slate-800 rounded-lg overflow-hidden bg-slate-950">
                        <table class="w-full text-left text-xs text-slate-400">
                            <tbody class="divide-y divide-slate-800/50">
                                ${(ep.clips||[]).map(c => {
                                    const badge = c.videohq_url ? '<span class="ml-1 text-[9px] text-blue-400 border border-blue-500/30 px-1 rounded">HQ</span>' : '';
                                    return `
                                    <tr class="hover:bg-blue-900/10 cursor-pointer group" onclick="openEditor(this, '${encodeURIComponent(JSON.stringify(c))}')">
                                        <td class="px-4 py-2 w-12"><div class="w-8 h-8 rounded bg-slate-800 overflow-hidden"><img src="${c.thumb_url}" class="w-full h-full object-cover"></div></td>
                                        <td class="px-4 py-2 font-mono truncate max-w-[150px]">${c.clip_name}</td>
                                        <td class="px-4 py-2 font-mono opacity-50 truncate max-w-[200px]">${c.video_url} ${badge}</td>
                                        <td class="px-2 py-2 text-right"><span class="material-symbols-rounded text-sm opacity-0 group-hover:opacity-100 text-blue-400">edit</span></td>
                                    </tr>`
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                    <div class="mt-3"><button onclick="openAddDrawer(${ep.number})" class="w-full py-2 border-2 border-dashed border-slate-700 hover:border-blue-500 text-slate-500 hover:text-blue-400 rounded-lg text-xs font-bold flex justify-center gap-2"><span class="material-symbols-rounded">add</span> Add Clip</button></div>
                </div>
            </div>`;
            document.getElementById('episodes-container').insertAdjacentHTML('beforeend', html);
        }

        function toggleAccordion(id) {
            document.getElementById(`content-${id}`).classList.toggle('hidden');
            document.getElementById(`chevron-${id}`).classList.toggle('rotate-180');
        }

        function openEditor(row, json) {
            currentEditingRow = row;
            const clip = JSON.parse(decodeURIComponent(json));
            document.getElementById('edit-clip-id').value = clip.id;
            document.getElementById('edit-filename').value = clip.clip_name;
            document.getElementById('edit-url').value = clip.video_url;
            document.getElementById('edit-hq-url').value = clip.videohq_url || '';
            document.getElementById('edit-thumb-url').value = clip.thumb_url;
            document.getElementById('edit-preview-img').src = clip.thumb_url;
            document.getElementById('edit-duration').value = clip.end_time || 10;
            showDrawer();
        }

        function openAddDrawer(epNum) {
            currentEditingEpNum = epNum;
            document.getElementById('edit-clip-id').value = "";
            document.getElementById('edit-filename').value = "Clip";
            document.getElementById('edit-url').value = "";
            document.getElementById('edit-hq-url').value = "";
            document.getElementById('edit-thumb-url').value = "";
            showDrawer();
        }

        function addEpisode() {
            // Function placeholder logic - usually involves creating empty Ep in DB
            const num = document.querySelectorAll('[id^="ep-"]').length + 1;
            fetch(`${API_URL}/admin/episodes`, { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${ADMIN_KEY}`},
                body: JSON.stringify({anime_id: document.getElementById('anime-id').value, number: num, title: `Episode ${num}`}) 
            }).then(() => loadData(ANIME_NAME_SLUG));
        }

        async function saveClipEditor() {
            const clipId = document.getElementById('edit-clip-id').value;
            const clipData = {
                clip_name: document.getElementById('edit-filename').value,
                video_url: document.getElementById('edit-url').value,
                videohq_url: document.getElementById('edit-hq-url').value || null,
                thumb_url: document.getElementById('edit-thumb-url').value,
                start_time: 0, 
                end_time: parseInt(document.getElementById('edit-duration').value)||10
            };

            try {
                const endpoint = clipId ? `${API_URL}/admin/clips/${clipId}` : `${API_URL}/admin/clips/bulk`;
                const method = clipId ? 'PUT' : 'POST';
                const body = clipId ? clipData : { anime: ANIME_NAME_SLUG, episode: currentEditingEpNum, clips: [clipData] };

                await fetch(endpoint, {
                    method: method,
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ADMIN_KEY}` },
                    body: JSON.stringify(body)
                });
                closeEditor(); 
                loadData(ANIME_NAME_SLUG);
            } catch (e) { alert("Error saving: " + e.message); }
        }

        // --- IMPORT LOGIC ---
        function openImportModal() { document.getElementById('import-modal').classList.remove('hidden'); }
        function closeImportModal() { document.getElementById('import-modal').classList.add('hidden'); }
        function handleFileSelect(e) {
            const f = e.target.files[0];
            const r = new FileReader();
            r.onload = (ex) => {
                importedJsonData = JSON.parse(ex.target.result);
                document.getElementById('json-paste-area').value = JSON.stringify(importedJsonData, null, 2);
            };
            r.readAsText(f);
        }
        async function processImport() {
            try {
                let data = importedJsonData;
                if (!data) data = JSON.parse(document.getElementById('json-paste-area').value);
                
                await fetch(`${API_URL}/admin/import/season`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ADMIN_KEY}` },
                    body: JSON.stringify({
                        anime_slug: ANIME_NAME_SLUG,
                        anime_title: document.getElementById('anime-title').value,
                        episodes: data.episodes
                    })
                });
                closeImportModal();
                loadData(ANIME_NAME_SLUG);
                alert("Import Successful");
            } catch(e) { alert("Import Failed: " + e.message); }
        }

        // Helpers
        function showDrawer() { document.getElementById('clip-editor-drawer').classList.remove('translate-x-full'); document.getElementById('drawer-overlay').classList.remove('hidden'); setTimeout(()=>document.getElementById('drawer-overlay').classList.remove('opacity-0'),10); }
        function closeEditor() { document.getElementById('clip-editor-drawer').classList.add('translate-x-full'); document.getElementById('drawer-overlay').classList.add('opacity-0'); setTimeout(()=>document.getElementById('drawer-overlay').classList.add('hidden'),300); }
        
        function handleTagInput(e) { if(e.key==='Enter'){ e.preventDefault(); const v=e.target.value.trim(); if(v && !activeTags.includes(v)) {activeTags.push(v); renderTags(); e.target.value='';}}}
        function removeTag(t) { activeTags=activeTags.filter(x=>x!==t); renderTags(); }
        function renderTags() { document.getElementById('tags-preview').innerHTML = activeTags.map(t=>`<span class="bg-slate-800 text-slate-200 px-2 py-1 rounded text-xs border border-slate-700 flex gap-1">${t}<button onclick="removeTag('${t}')">×</button></span>`).join(''); }
        function updatePosterPreview(u) { if(u){ document.getElementById('poster-preview').src=u; document.getElementById('poster-preview').classList.remove('hidden'); document.getElementById('poster-zone').classList.add('hidden'); document.getElementById('poster-url-input').value=u; }}
        async function handlePosterUpload(e) { const f = e.target.files[0]; if (!f) return; const fd = new FormData(); fd.append("image", f); try { const r = await fetch(`https://api.imgbb.com/1/upload?key=adb6a9fa4d9bfd8a79dfd0c0ea519e39`, { method: 'POST', body: fd }); const d = await r.json(); if (d.success) updatePosterPreview(d.data.url); } catch (err) { alert("Upload error"); } }
        async function deleteCurrentClip() { if(confirm("Delete clip?")) { await fetch(`${API_URL}/admin/clips/${document.getElementById('edit-clip-id').value}`, {method:'DELETE', headers:{'Authorization':`Bearer ${ADMIN_KEY}`}}); closeEditor(); loadData(ANIME_NAME_SLUG); } }
        async function saveAllChanges() {
            const title = document.getElementById('anime-title').value;
            const slug = ANIME_NAME_SLUG || title.toLowerCase().replace(/\s+/g, '_');
            const p = { name: slug, title: title, description: document.getElementById('anime-desc').value, poster_url: document.getElementById('poster-url-input').value, genres: activeTags, is_featured: document.getElementById('anime-featured').checked };
            await fetch(`${API_URL}/admin/animes`, {method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${ADMIN_KEY}`}, body:JSON.stringify(p)});
            alert("Saved"); if(!ANIME_NAME_SLUG) window.location.href=`edit.html?name=${slug}`;
        }
    </script>
</body>
</html>
