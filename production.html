<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v4 Production Console | AniClips</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
        }

        .material-symbols-rounded {
            font-size: 18px;
        }

        .chunk {
            height: 6px;
            border-radius: 1px;
            width: 100%;
            transition: all 0.3s ease;
        }

        .chunk.pending {
            background: #1e293b;
        }

        .chunk.assigned {
            background: #3b82f6;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.3);
            animation: pulse 2s infinite;
        }

        .chunk.completed {
            background: #10b981;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }

            100% {
                opacity: 1;
            }
        }

        .input-dark {
            background: #020617;
            border: 1px solid #1e293b;
            color: white;
            border-radius: 12px;
            padding: 14px;
            font-size: 13px;
            width: 100%;
            outline: none;
            transition: all 0.2s;
        }

        .input-dark:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .search-item:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.4);
        }

        .torrent-item:hover {
            border-color: #3b82f6;
            background: #0f172a;
        }

        .row-ignored {
            opacity: 0.3;
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }

        .chunk-container {
            display: grid;
            grid-template-columns: repeat(24, minmax(0, 1fr));
            gap: 2px;
        }

        .step-dot {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: #1e293b;
        }

        .step-dot.active {
            background: #3b82f6;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
            transform: scale(1.2);
        }

        .mapping-slot {
            transition: all 0.2s ease;
            cursor: pointer;
            border-width: 2px;
        }

        .mapping-slot.active {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.05);
        }

        .folder-node {
            user-select: none;
            transition: background 0.1s;
        }

        .folder-node:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .file-node {
            cursor: pointer;
            transition: all 0.2s;
        }

        .file-node:hover {
            color: #3b82f6;
            background: rgba(59, 130, 246, 0.05);
        }

        .file-node.used {
            opacity: 0.4;
            pointer-events: none;
            text-decoration: line-through;
        }

        .modal-overlay {
            background: rgba(2, 6, 23, 0.7);
            backdrop-filter: blur(8px);
        }

        .menu-content {
            padding-top: 8px;
            margin-top: -4px;
        }

        .menu-btn {
            font-family: 'Inter', sans-serif !important;
            text-transform: uppercase;
            font-weight: 900;
            font-size: 10px;
            letter-spacing: 0.05em;
            color: #3b82f6;
            transition: all 0.2s;
        }

        .menu-btn:hover {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
        }
    </style>
</head>

<body class="flex flex-col">

    <!-- NAVBAR -->
    <nav
        class="border-b border-white/5 bg-slate-950/80 backdrop-blur-md h-14 flex items-center px-6 shrink-0 z-40 justify-between">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2">
                <div class="w-6 h-6 bg-blue-600 rounded flex items-center justify-center text-white"><span
                        class="material-symbols-rounded text-sm">factory</span></div>
                <span class="text-slate-200 font-black uppercase text-xs tracking-tighter">AniClips <span
                        class="text-blue-500 font-mono text-[9px] ml-1">V4_STABLE</span></span>
            </div>
            <div class="h-4 w-px bg-white/10"></div>
            <div class="flex items-center gap-6 text-[10px] font-black uppercase tracking-widest text-slate-500">
                <a href="admin.html" class="hover:text-white transition-colors">Admin Panel</a>
                <a href="" class="text-blue-400">Production Console</a>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="openReviewInbox()" title="Pending Reviews"
                class="relative bg-slate-900 border border-white/10 hover:bg-slate-800 text-white p-2 rounded-lg transition-all shadow-lg flex items-center justify-center">
                <span class="material-symbols-rounded text-[20px]">inbox</span>
                <span id="inbox-badge"
                    class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-[10px] font-black translate-x-1/4 -translate-y-1/4 min-w-[20px] h-5 rounded-full flex items-center justify-center border-2 border-slate-950 hidden shadow-[0_0_10px_rgba(239,68,68,0.5)]">0</span>
            </button>
            <button onclick="openQueueModal()"
                class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg font-black text-[10px] flex items-center gap-2 transition-all uppercase tracking-widest shadow-lg shadow-blue-500/20">
                <span class="material-symbols-rounded text-sm">add_task</span> Queue Production
            </button>
        </div>
    </nav>

    <!-- STATUS STRIP -->
    <div class="bg-slate-900/40 border-b border-white/5 h-12 flex items-stretch shrink-0">
        <div class="container mx-auto px-6 flex items-center gap-8">
            <div class="flex items-center gap-2 text-[10px] font-black uppercase tracking-tighter text-slate-500">
                <span class="material-symbols-rounded text-blue-500 text-sm">robot_2</span>
                <span>Titans:</span> <span id="stat-workers" class="text-white ml-1">0</span>
            </div>
            <div class="flex items-center gap-2 text-[10px] font-black uppercase tracking-tighter text-slate-500">
                <span class="material-symbols-rounded text-emerald-500 text-sm">inventory_2</span>
                <span>Projects:</span> <span id="stat-animes" class="text-white ml-1">0</span>
            </div>
            <div id="sync-indicator"
                class="ml-auto flex items-center gap-2 text-[8px] font-mono text-slate-600 uppercase">
                <div class="w-1.5 h-1.5 rounded-full bg-emerald-500" id="sync-dot"></div>
                <span id="last-sync">System Nominal</span>
            </div>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <main class="flex-grow grid grid-cols-12 gap-6 p-6 overflow-hidden min-h-0">
        <!-- Floor Pane -->
        <div
            class="col-span-8 flex flex-col bg-slate-900/50 border border-white/5 rounded-2xl shadow-2xl overflow-hidden">
            <div id="content-pane" class="flex-grow overflow-y-auto divide-y divide-white/5">
                <div
                    class="p-20 text-center text-slate-700 uppercase font-black text-[10px] tracking-widest italic animate-pulse">
                    Scanning production floor...</div>
            </div>
        </div>

        <!-- Node List -->
        <div
            class="col-span-4 flex flex-col bg-slate-900/50 border border-white/5 rounded-2xl shadow-xl overflow-hidden h-full">
            <div
                class="bg-slate-950/20 px-6 py-3 border-b border-white/5 flex justify-between items-center shrink-0 text-[10px] font-black uppercase tracking-widest text-slate-500">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-rounded text-blue-500 text-sm">sensors</span>
                    <span>Active Nodes</span>
                </div>
                <div id="fleet-summary" class="flex gap-3">
                    <span class="text-blue-400" id="summary-working">0W</span>
                    <span class="text-slate-500" id="summary-idle">0I</span>
                    <span class="text-red-500" id="summary-offline">0O</span>
                </div>
            </div>
            <div id="fleet-list" class="flex-1 min-h-0 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                <div class="text-center text-[10px] font-bold text-slate-700 mt-10 uppercase tracking-widest">No active
                    Titans</div>
            </div>
        </div>
    </main>

    <!-- QUEUE MODAL -->
    <div id="queue-modal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
        <div
            class="bg-slate-900 border border-white/10 w-full max-w-5xl h-[85vh] rounded-[32px] shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in duration-200">

            <!-- Header -->
            <div class="px-8 py-5 border-b border-white/5 flex justify-between items-center bg-slate-950/50">
                <div class="flex items-center gap-6">
                    <div class="flex gap-2">
                        <div id="dot-1" class="step-dot w-2 h-2 rounded-full active"></div>
                        <div id="dot-2" class="step-dot w-2 h-2 rounded-full"></div>
                        <div id="dot-3" class="step-dot w-2 h-2 rounded-full"></div>
                    </div>
                    <h2 id="modal-title" class="text-xs font-black text-white uppercase tracking-widest">Search Anime
                    </h2>
                </div>
                <button onclick="closeQueueModal()"
                    class="w-8 h-8 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white transition-all">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>

            <!-- Steps -->
            <div id="step-1" class="p-8 flex flex-col h-full overflow-hidden">
                <div class="flex gap-3 mb-8">
                    <input type="text" id="jikan-input" onkeydown="if(event.key==='Enter') searchJikan()"
                        class="input-dark flex-grow" placeholder="Enter title (e.g. Solo Leveling)...">
                    <button onclick="searchJikan()"
                        class="bg-blue-600 hover:bg-blue-500 transition-colors px-10 rounded-xl font-black text-[10px] uppercase tracking-widest">Search
                        Series</button>
                </div>
                <div id="search-results" class="grid grid-cols-2 gap-3 overflow-y-auto pr-2"></div>
            </div>

            <div id="step-2" class="hidden p-8 flex flex-col h-full overflow-hidden">
                <div class="flex gap-3 mb-6 shrink-0">
                    <input type="text" id="torrent-search-input" onkeydown="if(event.key==='Enter') fetchTorrents()"
                        class="input-dark flex-grow" placeholder="Search for magnets (e.g. Solo Leveling S01)...">
                    <button onclick="fetchTorrents()"
                        class="bg-blue-600 hover:bg-blue-500 transition-colors px-10 rounded-xl font-black text-[10px] uppercase tracking-widest">Re-Scrape</button>
                </div>
                <div id="torrent-results" class="space-y-3 overflow-y-auto pr-2"></div>
            </div>

            <div id="step-3" class="hidden p-8 flex flex-col h-full overflow-hidden">
                <div class="flex justify-between items-center mb-6 pb-6 border-b border-white/5">
                    <div class="flex items-center gap-4">
                        <button onclick="setStep(2)"
                            class="text-[10px] font-black text-slate-500 hover:text-white uppercase tracking-widest transition-colors flex items-center gap-2 mr-4">
                            <span class="material-symbols-rounded">arrow_back</span> Source Settings
                        </button>
                        <button onclick="runAutoGuess()"
                            class="bg-blue-600/20 hover:bg-blue-600/40 text-blue-400 border border-blue-500/30 px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center gap-2 transition-all">
                            <span class="material-symbols-rounded text-sm">magic_button</span> Auto-Match Files
                        </button>
                    </div>

                    <div class="flex items-center gap-6">
                        <div
                            class="text-[10px] font-black text-slate-500 uppercase tracking-widest pl-2 flex items-center">
                            Matched: <span id="match-count" class="text-blue-500 ml-2">0</span> <span
                                class="mx-1">/</span> <span id="total-target">--</span>
                        </div>
                        <div class="h-6 w-px bg-white/10"></div>
                        <button onclick="clearMappings()"
                            class="px-4 py-2 rounded-xl font-black text-[10px] text-slate-500 uppercase hover:bg-white/5 transition-all">Clear
                            All</button>
                        <button onclick="confirmAndQueue()" id="btn-submit"
                            class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-2.5 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg shadow-emerald-600/20 transition-all">
                            Initialize Production
                        </button>
                    </div>
                </div>

                <div class="flex gap-6 h-full overflow-hidden">
                    <div id="episode-slots" class="w-1/3 flex flex-col gap-2 overflow-y-auto pr-2 pb-4"></div>
                    <div class="w-2/3 bg-slate-950/50 rounded-2xl border border-white/5 flex flex-col overflow-hidden">
                        <div class="p-3 border-b border-white/5 bg-slate-950/20 flex items-center justify-between">
                            <span class="text-[9px] font-black uppercase text-slate-500 tracking-widest px-2">Torrent
                                File Tree</span>
                        </div>
                        <div id="file-tree"
                            class="flex-grow overflow-y-auto p-4 font-mono text-[11px] leading-loose pb-8"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- WORKER MODAL -->
    <div id="worker-modal" class="fixed inset-0 modal-overlay z-[60] hidden flex items-center justify-center p-4">
        <div
            class="bg-slate-900 border border-white/10 w-full max-w-3xl rounded-[24px] shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in duration-200">
            <div class="px-6 py-4 border-b border-white/5 flex justify-between items-center bg-slate-950/50">
                <h2 class="text-xs font-black text-white uppercase tracking-widest flex items-center gap-2"><span
                        class="material-symbols-rounded text-blue-500">memory</span> Node Diagnostics</h2>
                <button onclick="closeWorkerModal()"
                    class="w-8 h-8 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white transition-all"><span
                        class="material-symbols-rounded">close</span></button>
            </div>
            <div id="worker-modal-content" class="p-6 text-sm text-slate-300 space-y-4"></div>
        </div>
    </div>

    <!-- ANIME INFO MODAL -->
    <div id="anime-info-modal" class="fixed inset-0 modal-overlay z-[60] hidden flex items-center justify-center p-4">
        <div
            class="bg-slate-900 border border-white/10 w-full max-w-2xl rounded-[24px] shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in duration-200 h-[80vh]">
            <div class="px-6 py-4 border-b border-white/5 flex justify-between items-center bg-slate-950/50">
                <h2 class="text-xs font-black text-white uppercase tracking-widest flex items-center gap-2"
                    id="info-modal-title">Anime Data</h2>
                <button onclick="closeAnimeInfoModal()"
                    class="w-8 h-8 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10 text-slate-400 hover:text-white transition-all"><span
                        class="material-symbols-rounded">close</span></button>
            </div>
            <div id="anime-info-content" class="p-6 text-sm text-slate-300 overflow-y-auto"></div>
        </div>
    </div>

    <!-- REVIEW SECTION -->
    <div id="review-section"
        class="fixed inset-0 bg-slate-950 z-[45] hidden flex-col animate-in slide-in-from-bottom duration-300 overflow-hidden">
        <nav
            class="border-b border-white/5 bg-slate-950/80 backdrop-blur-md h-14 flex items-center px-6 shrink-0 justify-between">
            <div class="flex items-center gap-4">
                <button onclick="closeReviewInbox()"
                    class="text-slate-400 hover:text-white flex items-center justify-center transition-colors"><span
                        class="material-symbols-rounded">arrow_back</span></button>
                <div class="flex text-[10px] font-black uppercase tracking-widest text-slate-500">
                    <span class="text-white">Admin Approval Inbox</span>
                </div>
            </div>
            <button id="approve-btn" disabled onclick="approveCurrentSelection()"
                class="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white px-6 py-2 rounded-lg font-black text-[10px] flex items-center gap-2 transition-all uppercase tracking-widest shadow-lg shadow-emerald-500/20">
                <span class="material-symbols-rounded text-sm">publish</span> Approve & Publish
            </button>
        </nav>
        <div class="flex-grow flex overflow-hidden">
            <div class="w-[30%] border-r border-white/5 bg-slate-900/30 overflow-y-auto p-4 space-y-4"
                id="review-list-container"></div>
            <div class="w-[70%] bg-[#020617] overflow-y-auto relative" id="review-preview-container"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://aniclip-backend.onrender.com/api';
        const ADMIN_KEY = localStorage.getItem('aniclip_admin_key');

        let selectedAnime = null;
        let selectedMagnet = null;
        let fileTreeData = {};
        let currentMappings = {};
        let focusedEpIndex = 0;
        let collapsedFolders = new Set();
        let expandedSlots = new Set();
        let fileSizes = {};

        async function safeFetch(endpoint, options = {}) {
            const headers = { 'Authorization': `Bearer ${ADMIN_KEY}`, ...options.headers };
            const res = await fetch(`${API_URL}${endpoint}`, { ...options, headers });
            if (!res.ok) {
                const err = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
                throw new Error(err.detail || err.error || 'Server Error');
            }
            return res.json();
        }

        function openQueueModal() {
            setStep(1);
            document.getElementById('queue-modal').classList.remove('hidden');
        }

        function closeQueueModal() {
            document.getElementById('queue-modal').classList.add('hidden');
        }

        function setStep(n) {
            [1, 2, 3].forEach(i => {
                document.getElementById(`step-${i}`).classList.toggle('hidden', i !== n);
                const dot = document.getElementById(`dot-${i}`);
                dot.className = `step-dot w-2 h-2 rounded-full ${i === n ? 'active' : (i < n ? 'bg-blue-900' : 'bg-slate-700')}`;
            });
            const titles = ["Discover Series", "Source Discovery", "Selection Bridge"];
            document.getElementById('modal-title').innerText = titles[n - 1];
        }

        async function searchJikan() {
            const q = document.getElementById('jikan-input').value;
            const resEl = document.getElementById('search-results');
            if (!q) return;

            resEl.innerHTML = `<div class="col-span-2 p-20 text-center animate-pulse text-blue-500 font-black text-[10px] uppercase">Contacting Databases...</div>`;

            try {
                const query = `query ($search: String) { Page(perPage: 10) { media(search: $search, type: ANIME) { idMal title { romaji english } coverImage { large } episodes averageScore type seasonYear } } }`;
                const aniRes = await fetch('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, variables: { search: q } })
                });

                if (!aniRes.ok) throw new Error("AniList Unavailable");

                const json = await aniRes.json();
                const aniData = json.data.Page.media;

                if (!aniData || aniData.length === 0) {
                    throw new Error("No results in AniList, falling back...");
                }

                const normalized = aniData.map(item => ({
                    mal_id: item.idMal,
                    title: item.title.english || item.title.romaji,
                    title_english: item.title.english,
                    title_japanese: item.title.romaji,
                    synopsis: "", // AniList query doesn't include it here, we'll fetch details later if needed or Jikan fallback
                    images: { jpg: { small_image_url: item.coverImage.large, large_image_url: item.coverImage.large } },
                    episodes: item.episodes,
                    year: item.seasonYear,
                    type: item.type,
                    score: item.averageScore ? (item.averageScore / 10).toFixed(1) : 'N/A'
                }));
                renderAnimeList(normalized, resEl);
            } catch (e) {
                try {
                    const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(q)}&limit=10`);
                    const { data } = await res.json();
                    renderAnimeList(data, resEl);
                } catch (err) {
                    resEl.innerHTML = `<div class="col-span-2 p-20 text-center text-red-500 font-black text-[10px] uppercase">Search Services Offline</div>`;
                }
            }
        }

        function renderAnimeList(data, container) {
            if (!data || data.length === 0) {
                container.innerHTML = `<div class="col-span-2 p-20 text-center text-slate-500 font-black text-[10px] uppercase">No Results Found</div>`;
                return;
            }
            container.innerHTML = data.map(item => {
                const safeJson = JSON.stringify(item).replace(/'/g, "&apos;");
                return `
                    <div onclick='selectAnime(${safeJson})' class="search-item group flex gap-4 p-4 border border-white/5 bg-slate-950/30 rounded-2xl cursor-pointer transition-all">
                        <img src="${item.images?.jpg?.small_image_url || ''}" class="w-16 h-20 object-cover rounded-xl shadow-lg">
                        <div class="flex flex-col justify-center">
                            <div class="text-sm font-black text-white group-hover:text-blue-400 transition-colors line-clamp-1">${item.title}</div>
                            <div class="text-[9px] text-slate-500 font-black uppercase mt-1 tracking-tighter">
                                ${item.episodes || '?'} EPISODES • ${item.year || item.seasonYear || 'N/A'}
                            </div>
                            <div class="mt-2 flex gap-1">
                                <span class="bg-blue-500/10 text-blue-400 text-[8px] font-black px-2 py-0.5 rounded-full uppercase">${item.type || 'TV'}</span>
                                <span class="bg-emerald-500/10 text-emerald-400 text-[8px] font-black px-2 py-0.5 rounded-full uppercase">SCORE: ${item.score || 'N/A'}</span>
                            </div>
                        </div>
                    </div>`;
            }).join('');
        }

        function selectAnime(item) {
            selectedAnime = {
                ...item,
                title_english: item.title_english || item.title,
                title_japanese: item.title_japanese || item.title,
                synopsis: item.synopsis || ""
            };
            document.getElementById('torrent-search-input').value = selectedAnime.title;
            setStep(2);
            fetchTorrents();
        }

        async function fetchTorrents() {
            const torEl = document.getElementById('torrent-results');
            const searchVal = document.getElementById('torrent-search-input').value.trim();
            const query = searchVal || selectedAnime.title;

            torEl.innerHTML = `<div class="p-20 text-center animate-pulse text-blue-400 font-black text-[10px] uppercase tracking-widest">Scraping Nyaa Index: ${query}...</div>`;
            try {
                const torrents = await safeFetch(`/production/search_torrents?q=${encodeURIComponent(query)}`);
                torEl.innerHTML = torrents.map(t => `
                    <div onclick="selectTorrent('${t.id}', '${t.magnet.replace(/'/g, "\\'")}')" class="torrent-item p-6 border border-white/5 bg-slate-950/20 rounded-2xl cursor-pointer transition-all group">
                        <div class="flex justify-between items-start mb-3">
                            <div class="text-sm font-bold text-slate-200 group-hover:text-blue-400 transition-colors line-clamp-1">${t.title}</div>
                        </div>
                        <div class="flex gap-6 text-[10px] font-black uppercase tracking-widest">
                            <span class="text-emerald-500 flex items-center gap-1"><span class="material-symbols-rounded text-xs">arrow_upward</span> ${t.seeders} Seeders</span>
                            <span class="text-slate-500 flex items-center gap-1"><span class="material-symbols-rounded text-xs">database</span> ${t.size}</span>
                            <span class="text-blue-500 ml-auto uppercase tracking-[0.2em] group-hover:underline">Select Pack</span>
                        </div>
                    </div>`).join('');
            } catch (e) {
                torEl.innerHTML = `<div class="p-20 text-center text-red-500 font-black text-[10px] uppercase">NYAA_DISCOVERY_FAILED: ${e.message}</div>`;
            }
        }

        function selectTorrent(id, magnet) {
            selectedMagnet = magnet;
            window._selectedTorrentId = id;
            setStep(3);
            initMappingBridge();
        }

        async function initMappingBridge() {
            const totalEps = selectedAnime.episodes || 12;
            document.getElementById('total-target').innerText = totalEps;
            currentMappings = {};
            collapsedFolders.clear();
            expandedSlots.clear();
            fileSizes = {};
            focusedEpIndex = 0;
            const container = document.getElementById('file-tree');
            container.innerHTML = `<div class="p-20 text-center animate-pulse text-slate-600 font-black text-[10px] uppercase tracking-widest">Inspecting File Tree...</div>`;

            renderSlots();

            try {
                fileTreeData = await safeFetch(`/production/torrent_files?id=${window._selectedTorrentId}`);
                const extractSizes = (node, path = "") => {
                    let currentPath = path;
                    if (node && node.name && node.name !== '/') {
                        currentPath = path ? `${path}/${node.name}` : node.name;
                    }
                    if (node.type === 'file' && node.size) {
                        fileSizes[currentPath] = node.size;
                    } else if (node.children) {
                        node.children.forEach(c => extractSizes(c, currentPath));
                    }
                };
                extractSizes(fileTreeData);
                renderTree();
            } catch (e) {
                container.innerHTML = `<div class="p-20 text-center text-red-500 font-black text-[10px] uppercase">Inspection Failed: ${e.message}</div>`;
            }
        }

        function toggleSlotExpand(e, idx) {
            e.stopPropagation();
            if (expandedSlots.has(idx)) expandedSlots.delete(idx);
            else expandedSlots.add(idx);
            renderSlots();
        }

        function renderSlots() {
            const container = document.getElementById('episode-slots');
            const total = selectedAnime.episodes || 12;
            container.innerHTML = '';

            for (let i = 0; i < total; i++) {
                const epNum = i + 1;
                const path = currentMappings[i];
                const isActive = focusedEpIndex === i;
                const isExpanded = expandedSlots.has(i);

                container.innerHTML += `
                    <div onclick="focusSlot(${i})" class="mapping-slot p-4 rounded-2xl border ${isActive ? 'active' : 'border-white/5 bg-slate-950/20 hover:bg-white/5'} flex flex-col gap-1 transition-all">
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] font-black ${isActive ? 'text-blue-400' : 'text-slate-500'} uppercase tracking-widest shrink-0">Episode ${epNum.toString().padStart(2, '0')}</span>
                            <div class="flex items-center gap-2">
                                ${path ? `<button onclick="toggleSlotExpand(event, ${i})" class="text-slate-500 hover:text-white transition-colors"><span class="material-symbols-rounded text-sm">${isExpanded ? 'unfold_less' : 'unfold_more'}</span></button><span class="material-symbols-rounded text-emerald-500 text-sm shrink-0">verified</span>` : (isActive ? '<span class="animate-pulse w-2 h-2 rounded-full bg-blue-500 shrink-0"></span>' : '')}
                            </div>
                        </div>
                        <div class="text-[11px] font-mono ${path ? 'text-slate-200' : 'text-slate-700 italic'} ${isExpanded ? 'break-words' : 'truncate'} mt-1 leading-snug">
                            ${path ? path.split('/').pop() : (isActive ? 'Awaiting selection...' : 'Pending')}
                        </div>
                        ${path && fileSizes[path] ? `<div class="text-[9.5px] text-emerald-500 font-mono mt-1 opacity-80">${fileSizes[path]}</div>` : ''}
                    </div>
                `;
            }
            updateCount();
        }

        function toggleFolder(path) {
            if (collapsedFolders.has(path)) collapsedFolders.delete(path);
            else collapsedFolders.add(path);
            renderTree();
        }

        function renderNestedTree(node, currentPath = "") {
            let html = "";
            let folderPath = currentPath;
            if (node.name !== '/') folderPath = currentPath ? `${currentPath}/${node.name}` : node.name;

            if (node.type === 'file') {
                const assignedEp = Object.entries(currentMappings).find(([_, p]) => p === folderPath)?.[0];
                const epNum = assignedEp !== undefined ? parseInt(assignedEp) + 1 : null;
                html += `
                    <div onclick="mapFile('${folderPath.replace(/'/g, "\\'")}')" class="file-node px-3 py-1.5 rounded-lg flex items-center gap-3 ${epNum ? 'opacity-40 pointer-events-none' : ''}" style="margin-left: 20px;">
                        <span class="material-symbols-rounded ${epNum ? 'text-emerald-500' : 'text-slate-600'} text-sm shrink-0">movie</span>
                        <span class="truncate ${epNum ? 'text-slate-500 line-through' : ''}">${node.name}</span>
                        ${epNum ? `<span class="ml-auto text-[9px] font-black text-emerald-500 uppercase tracking-widest bg-emerald-500/10 px-2 py-0.5 rounded-lg shrink-0">[EP ${epNum}]</span>` : ''}
                    </div>`;
            } else if (node.type === 'directory') {
                const isCollapsed = collapsedFolders.has(folderPath);
                if (node.name !== '/') {
                    html += `
                        <div class="folder-node px-3 py-1.5 rounded-lg flex items-center justify-between mt-1 cursor-pointer" onclick="toggleFolder('${folderPath.replace(/'/g, "\\'")}')" style="margin-left: 20px;">
                            <div class="flex items-center gap-3">
                                <span class="material-symbols-rounded ${isCollapsed ? 'text-slate-600' : 'text-blue-500'} text-sm">${isCollapsed ? 'folder' : 'folder_open'}</span>
                                <span class="${isCollapsed ? 'text-slate-500' : 'text-blue-400'} font-bold uppercase tracking-widest text-[9px]">${node.name}</span>
                            </div>
                            <span class="material-symbols-rounded ${isCollapsed ? 'text-slate-600' : 'text-slate-400'} text-sm shrink-0">${isCollapsed ? 'chevron_right' : 'expand_more'}</span>
                        </div>`;
                }
                if (node.children) {
                    const childrenHtml = node.children.map(child => renderNestedTree(child, folderPath)).join('');
                    const isRoot = node.name === '/';
                    const wrapperClass = isRoot ? '' : (isCollapsed ? 'hidden' : 'border-l border-white/5 ml-[26px] pl-1');
                    html += `<div class="${wrapperClass}">${childrenHtml}</div>`;
                }
            }
            return html;
        }

        function renderTree() {
            const container = document.getElementById('file-tree');
            if (!fileTreeData || Object.keys(fileTreeData).length === 0) {
                container.innerHTML = `<div class="p-4 text-[10px] text-slate-500">Tree Error/Empty</div>`;
                return;
            }
            container.innerHTML = renderNestedTree(fileTreeData);
        }

        function focusSlot(idx) {
            focusedEpIndex = idx;
            renderSlots();
        }

        function mapFile(path) {
            currentMappings[focusedEpIndex] = path;
            const total = selectedAnime.episodes || 12;
            if (focusedEpIndex < total - 1) focusedEpIndex++;
            renderSlots();
            renderTree();
        }

        function runAutoGuess() {
            const walk = (node, path = "") => {
                let currentPath = path;
                if (node.name !== '/') currentPath = path ? `${path}/${node.name}` : node.name;
                if (node.type === 'file') {
                    const fileName = node.name;
                    const match = fileName.match(/[ \-_E\[]([0-9]{2,3})[ \-\._\]]/i) || fileName.match(/([0-9]{2,3})\.(mkv|mp4)/i);
                    if (match) {
                        const num = parseInt(match[1]);
                        if (num > 0 && num <= (selectedAnime.episodes || 100)) {
                            currentMappings[num - 1] = currentPath;
                        }
                    }
                } else if (node.children) {
                    node.children.forEach(c => walk(c, currentPath));
                }
            };
            walk(fileTreeData);
            renderSlots();
            renderTree();
        }

        function clearMappings() {
            currentMappings = {};
            focusedEpIndex = 0;
            renderSlots();
            renderTree();
        }

        function updateCount() {
            const count = Object.keys(currentMappings).length;
            document.getElementById('match-count').innerText = count;
        }

        async function confirmAndQueue() {
            const btn = document.getElementById('btn-submit');
            const mappings = [];

            Object.entries(currentMappings).forEach(([epIdx, path]) => {
                if (path) {
                    mappings.push({ episode_num: parseInt(epIdx) + 1, file_path: path });
                }
            });

            if (mappings.length === 0) return alert("Select at least one episode.");
            btn.disabled = true;
            btn.innerText = "Syncing with Titans...";

            try {
                await safeFetch('/production/queue', {
                    method: 'POST',
                    body: JSON.stringify({
                        mal_id: selectedAnime.mal_id,
                        title: selectedAnime.title,
                        title_english: selectedAnime.title_english,
                        title_japanese: selectedAnime.title_japanese,
                        slug: selectedAnime.title.toLowerCase().replace(/[^a-z0-9]+/g, '_'),
                        poster_url: selectedAnime.images.jpg.large_image_url,
                        description: selectedAnime.synopsis || "",
                        source_magnet: selectedMagnet,
                        mappings: mappings
                    }),
                    headers: { 'Content-Type': 'application/json' }
                });
                closeQueueModal();
                btn.disabled = false;
                btn.innerText = "Initialize Production";
                refresh();
            } catch (e) {
                alert(e.message);
                btn.disabled = false;
                btn.innerText = "Initialize Production";
            }
        }

        async function refresh() {
            const dot = document.getElementById('sync-dot');
            const syncText = document.getElementById('last-sync');
            if (dot) dot.className = "w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse";

            try {
                const [tasks, fleet, review] = await Promise.all([
                    safeFetch('/production/tasks'),
                    safeFetch('/production/fleet'),
                    safeFetch('/production/review/count').catch(() => ({ count: 0 }))
                ]);

                const badge = document.getElementById('inbox-badge');
                if (review && review.count > 0) {
                    badge.innerText = review.count;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }

                document.getElementById('stat-workers').innerText = fleet.length;
                renderWorkers(fleet);

                const groups = {};
                tasks.forEach(t => {
                    if (!groups[t.anime_slug]) {
                        groups[t.anime_slug] = {
                            title: t.anime_title,
                            id: t.anime_id,
                            mal_id: t.mal_id,
                            status: t.anime_status,
                            priority: t.anime_priority,
                            tasks: []
                        };
                    }
                    groups[t.anime_slug].tasks.push(t);
                });

                document.getElementById('stat-animes').innerText = Object.keys(groups).length;
                renderFloor(groups);

                if (syncText) syncText.innerText = `System Sync: ${new Date().toLocaleTimeString()}`;
                if (dot) dot.className = "w-1.5 h-1.5 rounded-full bg-emerald-500";
            } catch (e) {
                console.error("Refresh Error:", e);
                if (syncText) syncText.innerText = "SYNC_ERROR";
                if (dot) dot.className = "w-1.5 h-1.5 rounded-full bg-red-500";
            }
        }

        function renderFloor(groups) {
            const pane = document.getElementById('content-pane');
            const entries = Object.entries(groups);
            if (entries.length === 0) {
                pane.innerHTML = `<div class="p-20 text-center text-slate-700 uppercase font-black text-[10px] tracking-widest">Floor Idle</div>`;
                return;
            }
            pane.innerHTML = entries.map(([slug, p]) => {
                const done = p.tasks.filter(t => t.status === 'COMPLETED').length;
                const total = p.tasks.length;
                const pct = Math.round((done / total) * 100) || 0;
                const animeId = p.id;
                const menuId = `menu-${animeId}`;

                return `
                <div class="px-6 py-6 group bg-blue-600/5 hover:bg-white/[0.02] border-b border-white/5 last:border-b-0 transition-colors relative">
                    <div class="absolute right-6 top-6 flex gap-2">
                        <button onclick="changePriority(${animeId}, ${p.priority + 1})" class="text-slate-500 hover:text-white"><span class="material-symbols-rounded">keyboard_arrow_up</span></button>
                        <button onclick="changePriority(${animeId}, ${p.priority - 1})" class="text-slate-500 hover:text-white"><span class="material-symbols-rounded">keyboard_arrow_down</span></button>
                        <div class="relative inline-block text-left" onmouseleave="document.getElementById('${menuId}').classList.add('hidden')">
                            <button onclick="document.getElementById('${menuId}').classList.toggle('hidden')" class="text-slate-500 hover:text-white ml-2"><span class="material-symbols-rounded">more_vert</span></button>
                            <div id="${menuId}" class="menu-content hidden absolute right-0 w-48 rounded-md shadow-lg bg-slate-900 border border-white/10 z-50">
                                <div class="py-1">
                                    <button onclick="showAnimeInfo(${p.mal_id})" class="menu-btn text-left w-full block px-4 py-2">Information</button>
                                    <button onclick="setAnimeStatus(${animeId}, '${p.status === 'PAUSED' ? 'PROCESSING' : 'PAUSED'}')" class="menu-btn text-left w-full block px-4 py-2">${p.status === 'PAUSED' ? 'Resume' : 'Pause'}</button>
                                    <button onclick="forceResetAnime(${animeId})" class="menu-btn text-left w-full block px-4 py-2 text-yellow-500">Force Reset</button>
                                    <button onclick="deleteAnimeQueue(${animeId})" class="menu-btn text-left w-full block px-4 py-2 text-red-400">Delete</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-between items-center mb-3 pr-24">
                        <div>
                            <div class="text-xs font-black text-blue-400 uppercase tracking-widest flex items-center gap-2">
                                ${p.title} 
                                ${p.status === 'PAUSED' ? '<span class="bg-yellow-500/20 text-yellow-500 px-2 py-0.5 rounded text-[8px]">PAUSED</span>' : ''}
                            </div>
                            <div class="text-[9px] text-slate-500 font-mono mt-1">${total} CHUNKS</div>
                        </div>
                        <div class="text-[11px] font-black text-blue-500 font-mono">${done}/${total} (${pct}%)</div>
                    </div>
                    <div class="chunk-container">${p.tasks.sort((a, b) => a.ep_num - b.ep_num).map(t => `<div class="chunk ${t.status.toLowerCase()}" title="Ep ${t.ep_num}"></div>`).join('')}</div>
                </div>`;
            }).join('');
        }

        function renderWorkers(fleet) {
            const list = document.getElementById('fleet-list');
            let working = 0, idle = 0, offline = 0;

            if (fleet.length === 0) {
                list.innerHTML = `<div class="text-center text-[10px] font-bold text-slate-700 mt-10 uppercase tracking-widest">NO TITANS ONLINE</div>`;
            } else {
                list.innerHTML = fleet.map(w => {
                    const isOffline = new Date() - new Date(w.last_heartbeat) > 300000;
                    if (isOffline) offline++;
                    else if (w.status !== 'IDLE') working++;
                    else idle++;

                    const escapedData = JSON.stringify(w).replace(/'/g, "&apos;").replace(/"/g, "&quot;");
                    return `<div onclick="openWorkerModal(${escapedData})" class="cursor-pointer p-4 bg-slate-950/50 border border-white/5 hover:border-blue-500/30 rounded-2xl transition-all ${isOffline ? 'opacity-40' : ''}">
                        <div class="flex justify-between text-[10px] font-black uppercase"><span class="text-slate-300 font-mono text-[9px]">${w.id}</span><span class="${isOffline ? 'text-red-500' : (w.status !== 'IDLE' ? 'text-blue-500 animate-pulse' : 'text-slate-600')}">${isOffline ? 'OFFLINE' : w.status}</span></div>
                        <div class="text-[9px] text-slate-500 mt-1 truncate italic">${w.status_message || 'Standby...'}</div>
                        ${!isOffline && w.status !== 'IDLE' ? `<div class="w-full bg-slate-900 h-1 rounded-full mt-3 overflow-hidden"><div class="bg-blue-600 h-full transition-all" style="width: ${w.progress || 0}%"></div></div>` : ''}
                    </div>`;
                }).join('');
            }

            document.getElementById('summary-working').innerText = `${working}W`;
            document.getElementById('summary-idle').innerText = `${idle}I`;
            document.getElementById('summary-offline').innerText = `${offline}O`;
        }

        function openWorkerModal(w) {
            const content = document.getElementById('worker-modal-content');
            const hasTask = w.anime_title || w.anime_title_romaji;
            const posterHtml = hasTask && w.anime_poster ? `<img src="${w.anime_poster}" class="w-full h-full object-cover opacity-80" />` : '<div class="flex items-center justify-center h-full text-slate-700 text-[10px] font-black uppercase text-center px-4">No active task</div>';

            content.innerHTML = `
                <div class="flex flex-col md:flex-row gap-6">
                    <div class="w-full md:w-1/3 shrink-0 rounded-xl overflow-hidden bg-slate-950/80 border border-white/5 relative aspect-[2/3] shadow-inner flex flex-col">
                        ${posterHtml}
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 to-transparent"></div>
                        ${hasTask ? `
                        <div class="absolute bottom-4 left-4 right-4">
                            <div class="text-[8px] uppercase text-emerald-400 font-black mb-1">Processing</div>
                            <div class="text-xs text-white font-bold leading-tight line-clamp-2">${w.anime_title || w.anime_title_romaji}</div>
                            <div class="text-[10px] text-blue-300 font-bold mt-1 uppercase tracking-widest">Episode ${w.episode_num}</div>
                        </div>` : ''}
                    </div>

                    <div class="flex-grow flex flex-col gap-4">
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-slate-950/50 p-3 rounded-lg border border-white/5"><span class="block text-[8px] uppercase text-slate-500 font-bold mb-1">ID</span><span class="font-mono text-blue-400 text-xs">${w.id}</span></div>
                            <div class="bg-slate-950/50 p-3 rounded-lg border border-white/5"><span class="block text-[8px] uppercase text-slate-500 font-bold mb-1">Progress</span><span class="text-emerald-400 font-mono text-xs">${w.progress || 0}%</span></div>
                        </div>
                        <div class="flex-grow bg-slate-950/80 p-4 rounded-xl border border-white/5 flex flex-col gap-2 relative">
                            <div class="flex items-center gap-2 mb-1"><span class="material-symbols-rounded text-blue-500 text-sm">terminal</span><span class="text-[9px] uppercase text-slate-400 font-black">Encoder Status</span></div>
                            <div class="bg-slate-900/50 p-3 rounded font-mono text-[10px] text-emerald-300 overflow-y-auto max-h-[120px]">${w.status_message || '...'}</div>
                        </div>
                        <div class="bg-slate-950/50 px-4 py-3 rounded-lg border border-white/5 flex justify-between items-center mt-auto">
                            <span class="text-[8px] uppercase text-slate-500 font-bold">Last Heartbeat</span>
                            <span class="text-slate-400 text-[10px] font-mono">${new Date(w.last_heartbeat).toLocaleString()}</span>
                        </div>
                    </div>
                </div>`;
            document.getElementById('worker-modal').classList.remove('hidden');
        }

        function closeWorkerModal() {
            document.getElementById('worker-modal').classList.add('hidden');
        }

        async function showAnimeInfo(mal_id) {
            if (!mal_id) return alert('No MAL ID linked.');
            const content = document.getElementById('anime-info-content');
            content.innerHTML = `<div class="p-10 text-center text-blue-500 animate-pulse font-bold text-xs uppercase">Fetching Jikan Data...</div>`;
            document.getElementById('anime-info-modal').classList.remove('hidden');
            try {
                const res = await fetch(`https://api.jikan.moe/v4/anime/${mal_id}`);
                const { data } = await res.json();
                document.getElementById('info-modal-title').innerText = data.title;
                content.innerHTML = `
                    <div class="flex gap-6">
                        <img src="${data.images.jpg.large_image_url}" class="w-48 rounded-xl shadow-lg border border-white/10 self-start">
                        <div class="flex flex-col gap-4">
                            <div>
                                <div class="text-lg font-black text-white">${data.title}</div>
                                <div class="text-xs text-slate-400">${data.title_english || ''} • ${data.title_japanese || ''}</div>
                            </div>
                            <div class="grid grid-cols-2 gap-4 text-xs">
                                <div><span class="text-slate-500 font-bold block mb-1">Episodes:</span> <span class="bg-slate-800 px-2 py-1 rounded text-slate-200">${data.episodes || '?'}</span></div>
                                <div><span class="text-slate-500 font-bold block mb-1">Score:</span> <span class="bg-slate-800 px-2 py-1 rounded text-emerald-400">${data.score || '?'}</span></div>
                                <div><span class="text-slate-500 font-bold block mb-1">Aired:</span> <span class="text-slate-300">${data.aired.string}</span></div>
                                <div><span class="text-slate-500 font-bold block mb-1">Rating:</span> <span class="text-slate-300">${data.rating}</span></div>
                            </div>
                            <div class="mt-2 text-slate-400 leading-relaxed text-xs p-4 bg-slate-950/50 rounded-xl border border-white/5 h-48 overflow-y-auto">
                                ${data.synopsis || 'No description available.'}
                            </div>
                        </div>
                    </div>`;
            } catch (err) {
                content.innerHTML = `<div class="text-red-500 text-center">Failed to load API data.</div>`;
            }
        }

        function closeAnimeInfoModal() {
            document.getElementById('anime-info-modal').classList.add('hidden');
        }

        async function changePriority(animeId, priority) {
            try {
                await safeFetch(`/production/tasks/${animeId}/priority`, {
                    method: 'POST',
                    body: JSON.stringify({ priority }),
                    headers: { 'Content-Type': 'application/json' }
                });
                refresh();
            } catch (err) { alert(err.message); }
        }

        async function setAnimeStatus(animeId, status) {
            try {
                await safeFetch(`/production/tasks/${animeId}/status`, {
                    method: 'POST',
                    body: JSON.stringify({ status }),
                    headers: { 'Content-Type': 'application/json' }
                });
                refresh();
            } catch (err) { alert(err.message); }
        }

        async function deleteAnimeQueue(animeId) {
            if (!confirm('Stop and delete this from the queue?')) return;
            try {
                await safeFetch(`/production/tasks/${animeId}`, { method: 'DELETE' });
                refresh();
            } catch (err) { alert(err.message); }
        }

        async function forceResetAnime(animeId) {
            if (!confirm('Force reset all pending tasks for this anime?')) return;
            try {
                await safeFetch(`/production/tasks/${animeId}/reset`, { method: 'POST' });
                refresh();
            } catch (err) { alert(err.message); }
        }

        async function openReviewInbox() {
            document.getElementById('review-section').classList.remove('hidden');
            document.getElementById('review-section').classList.add('flex');
            const container = document.getElementById('review-list-container');
            container.innerHTML = `<div class="p-10 text-center text-blue-500 animate-pulse uppercase tracking-widest text-[10px] font-bold">Loading...</div>`;

            try {
                const list = await safeFetch('/production/review/list');
                if (list.length === 0) {
                    container.innerHTML = `<div class="p-10 text-center text-slate-500 uppercase tracking-widest text-[10px] font-bold">Inbox Empty</div>`;
                    return;
                }
                container.innerHTML = list.map(item => `
                    <div onclick="selectReviewItem(${item.id}, '${item.slug}')" class="p-4 bg-slate-950/50 border border-white/5 hover:border-blue-500/50 rounded-xl cursor-pointer transition-all flex gap-4">
                        <img src="${item.poster_url}" class="w-12 h-16 object-cover rounded pointer-events-none">
                        <div class="pointer-events-none w-full">
                            <div class="font-bold text-slate-200 text-xs mb-1 line-clamp-1">${item.title_english || item.title}</div>
                            <div class="text-[9px] uppercase tracking-widest text-slate-500">Waitlist Ready</div>
                        </div>
                    </div>`).join('');
            } catch (err) {
                container.innerHTML = `<div class="text-red-500">Error: ${err.message}</div>`;
            }
        }

        function closeReviewInbox() {
            document.getElementById('review-section').classList.add('hidden');
            document.getElementById('review-section').classList.remove('flex');
            selectedReviewId = null;
            document.getElementById('review-preview-container').innerHTML = '';
            document.getElementById('approve-btn').disabled = true;
        }

        let selectedReviewId = null;
        function selectReviewItem(id, slug) {
            selectedReviewId = id;
            document.getElementById('approve-btn').disabled = false;
            document.getElementById('review-preview-container').innerHTML = `
                <iframe src="./anime.html?slug=${slug}" class="w-full h-full border-none bg-[#020617]"></iframe>
                <div class="absolute inset-0 pointer-events-none shadow-[inset_0_0_100px_rgba(0,0,0,0.8)] border border-blue-500/20"></div>`;
        }

        async function approveCurrentSelection() {
            if (!selectedReviewId) return;
            const btn = document.getElementById('approve-btn');
            btn.disabled = true;
            btn.innerText = "Approving...";
            try {
                await safeFetch(`/production/review/${selectedReviewId}/approve`, { method: 'POST' });
                selectedReviewId = null;
                document.getElementById('review-preview-container').innerHTML = `<div class="p-10 text-emerald-500 text-center uppercase tracking-widest font-black text-xs">Successfully Published!</div>`;
                openReviewInbox();
                refresh();
                setTimeout(() => { btn.innerText = "Approve & Publish"; }, 2000);
            } catch (err) {
                alert("Approval Failed: " + err.message);
                btn.disabled = false;
            }
        }

        window.onload = () => {
            refresh();
            setInterval(refresh, 5000);
        };
    </script>
</body>

</html>
